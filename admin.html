<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>

    <link rel="stylesheet" href="./admin.css">
</head>

<body>

    <header class="cabecalho">
        <h1>Painel Administrativo</h1>
        <p>Gestão de produtos da pizzaria</p>
    </header>

    <main class="container">

        <!-- FORMULÁRIO -->

        <section class="formulario-produto">

            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    required
                >

                <label for="categoria">
                    Categoria
                </label>

                <select
                    id="categoria"
                    required
                >

                    <option value="">
                        Selecione
                    </option>

                    <option value="Pizza Tradicional">
                        Pizza Tradicional
                    </option>

                    <option value="Pizza Especial">
                        Pizza Especial
                    </option>

                    <option value="Bebida">
                        Bebida
                    </option>

                    <option value="Sobremesa">
                        Sobremesa
                    </option>

                </select>

                <label for="descricao">
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    rows="4"
                    required
                ></textarea>

                <label for="preco">
                    Preço
                </label>

                <input
                    type="number"
                    id="preco"
                    step="0.01"
                    required
                >

                <label for="estoque">
                    Estoque
                </label>

                <input
                    type="number"
                    id="estoque"
                    required
                >

                <label for="imagem">
                    URL da Imagem
                </label>

                <input
                    type="text"
                    id="imagem"
                    required
                >

                <input type="hidden" id="idProduto">
                <button type="submit">
                    Cadastrar Produto
                </button>

            </form>

        </section>

        <!-- LISTA DE PRODUTOS -->

        <section>

            <h2>Produtos Cadastrados</h2>

            <div id="listaProdutos">

            </div>

        </section>

    </main>

    <script src="./admin.js"></script>

</body>

</html>
